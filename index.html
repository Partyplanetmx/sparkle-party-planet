<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#160066">
<title>Party Planet V26</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=26">
<script>(async function(){const V='26';if(localStorage.getItem('pp_app_version')!==V){localStorage.setItem('pp_app_version',V);try{if('serviceWorker' in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}if('caches' in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}}catch(e){}}})();</script>
</head>
<body>
<div class="space-motion" aria-hidden="true">
  <span class="star s1">✦</span><span class="star s2">★</span><span class="star s3">✧</span>
  <span class="star s4">✦</span><span class="star s5">★</span><span class="star s6">✧</span>
  <span class="planet p1"></span><span class="planet p2"></span>
  <span class="comet c1"></span><span class="comet c2"></span>
</div>
<div class="space-bg"></div>
<div id="app">
<header class="topbar">
  <div class="top-left-actions"><button class="parents" onclick="openParentGate()">👥 PARA PADRES</button><button class="admin-secret" onclick="openAdminGate()" title="Administrador">🔐</button><button class="motion-toggle" onclick="toggleMotion()" title="Activar o reducir movimiento">✨</button></div>
  <div class="brand brand-image" onclick="go('home')">
      <img src="assets/images/logo_party_planet_v25.png" alt="Sparkly Party Planet">
    </div>
  <div class="wallet">
    <span>⭐ <b id="starsTop">1250</b></span>
    <span>💎 <b id="gemsTop">35</b></span>
    <button onclick="go('settings')">⚙️</button>
  </div>
</header>

<section class="hero-banner">
  <div class="hero-characters">
    <div class="character-bubble">👧🏻</div>
    <div class="character-bubble">👧🏼</div>
    <span>LAS CHESPITAS</span>
  </div>
  <div class="hero-copy">
    <h1>APRENDE, CANTA Y DIVIÉRTETE</h1>
    <div>
      <button onclick="go('karaoke')">🎤 ¡A CANTAR!</button>
      <button onclick="go('study')">🎓 ¡A APRENDER!</button>
    </div>
  </div>
  <button class="vip-btn" onclick="go('vip')">👑 HAZTE VIP</button>
</section>

<div class="section-banner">ELIGE UNA ACTIVIDAD</div>

<div id="mainNav" class="quick-nav">
    <button data-screen="home" onclick="go('home')">🏠 <span>INICIO</span></button>
    <button data-screen="karaoke" onclick="go('karaoke')">🎤 <span>KARAOKE</span></button>
    <button data-screen="stories" onclick="go('stories')">📖 <span>CUENTOS</span></button>
    <button data-screen="games" onclick="go('games')">🎮 <span>JUEGOS</span></button>
    <button data-screen="languages" onclick="go('languages')">🌍 <span>IDIOMAS</span></button>
    <button data-screen="study" onclick="go('study')">🎓 <span>MODO ESTUDIO</span></button>
    <button data-screen="color" onclick="go('color')">🎨 <span>COLOREA</span></button>
    <button data-screen="avatar" onclick="go('avatar')">👕 <span>PERSONALIZA</span></button>
    <button data-screen="music" onclick="go('music')">🎵 <span>MÚSICA</span></button>
    <button data-screen="rewards" onclick="go('rewards')">🏆 <span>RECOMPENSAS</span></button>
    <button data-screen="store" onclick="go('store')">🛍️ <span>TIENDA</span></button>
    <button data-screen="events" onclick="go('events')">🗓️ <span>EVENTOS</span></button>
    <button data-screen="animals" onclick="go('animals')">🐾 <span>ANIMALES</span></button>
    <button data-screen="puzzle" onclick="go('puzzle')">🧩 <span>PUZZLE KIDS</span></button>
    <button data-screen="syllables" onclick="go('syllables')">🔤 <span>SÍLABAS</span></button>
    <button data-screen="piano" onclick="go('piano')">🎹 <span>PIANO</span></button>
    <button data-screen="musicgames" onclick="go('musicgames')">🎶 <span>JUEGOS MUSICALES</span></button>
    <button data-screen="settings" onclick="go('settings')">⚙️ <span>AJUSTES</span></button>
    <div class="kangaroo">🦘<small>Cangurito Bailarín</small></div>
  </div>
<div class="app-layout app-layout-wide">
  <main class="content content-wide">
    <section id="screen-home" class="screen active"></section>
    <section id="screen-karaoke" class="screen"></section>
    <section id="screen-stories" class="screen"></section>
    <section id="screen-games" class="screen"></section>
    <section id="screen-languages" class="screen"></section>
    <section id="screen-study" class="screen"></section>
    <section id="screen-color" class="screen"></section>
    <section id="screen-avatar" class="screen"></section>
    <section id="screen-music" class="screen"></section>
    <section id="screen-rewards" class="screen"></section>
    <section id="screen-store" class="screen"></section>
    <section id="screen-events" class="screen"></section>
    <section id="screen-settings" class="screen"></section>
    <section id="screen-vip" class="screen"></section>
    <section id="screen-parents" class="screen"></section>
    <section id="screen-admin" class="screen"></section>
    <section id="screen-cloud" class="screen"></section>
    <section id="screen-analytics" class="screen"></section>
    <section id="screen-animals" class="screen"></section>
    <section id="screen-puzzle" class="screen"></section>
    <section id="screen-syllables" class="screen"></section>
    <section id="screen-piano" class="screen"></section>
    <section id="screen-musicgames" class="screen"></section>
  </main>
</div>
</div>

<div id="modal" class="modal hidden"><div class="modal-card"><button class="modal-close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div>
<div id="toast"></div>
<script src="app.js?v=26"></script>
</body>
</html>
