<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sparkly Party Planet V9</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#7b2cff,#ff4fb3,#2aa8ff);color:white;text-align:center}
header{padding:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;padding:20px}
.card{background:rgba(255,255,255,.18);padding:20px;border-radius:18px}
button{padding:12px 18px;border:none;border-radius:12px;background:#ffd84d;font-weight:bold}
footer{padding:20px}
</style>
</head>
<body>
<header>
<h1>🎉 Sparkly Party Planet - Versión 9</h1>
<p>Las Chespitas te dan la bienvenida.</p>
<button onclick="saludar()">▶ Escuchar bienvenida</button>
</header>
<div class="grid">
<div class="card">🎵 Party Planet Music</div>
<div class="card">📚 Cuentos</div>
<div class="card">🌎 Idiomas</div>
<div class="card">🎮 Juegos</div>
<div class="card">⭐ Recompensas</div>
<div class="card">👨‍👩‍👧 Área para padres</div>
</div>
<footer>Agrega aquí las imágenes PNG sin fondo de Las Chespitas y Sparkly para personalizar la app.</footer>
<script>
function saludar(){
const t=new SpeechSynthesisUtterance("Hola. Somos las Chespitas. Bienvenido a Party Planet. Vamos a cantar, jugar y aprender juntos.");
t.lang="es-MX"; t.pitch=1.3; t.rate=0.9;
speechSynthesis.speak(t);
}
</script>
</body>
</html>
